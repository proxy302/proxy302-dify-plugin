identity:
  author: proxy302
  name: proxy302
  label:
    en_US: Proxy302
    zh_Hans: Proxy302
  description:
    en_US: Check Proxy302 traffic and usage, browse countries and plans, look up your residential proxies, and fetch web pages through your own proxy. Read-only; never spends money.
    zh_Hans: 查询 Proxy302 流量与用量、国家与套餐、已有的住宅代理，并通过你自己的代理抓取网页。只读，不会产生任何消费。
  icon: icon.svg
  tags:
    - utilities
    - productivity
credentials_for_provider:
  key_id:
    type: secret-input
    required: true
    label:
      en_US: Key ID
      zh_Hans: Key ID
    placeholder:
      en_US: PROXY302_KEY_ID
      zh_Hans: PROXY302_KEY_ID
    help:
      en_US: 'In the Proxy302 console, open API keys, open your key and click "Copy as env vars". Paste the PROXY302_KEY_ID value here.'
      zh_Hans: 在 Proxy302 控制台打开「API 密钥」，点开你的密钥，点「复制为环境变量」，把 PROXY302_KEY_ID 的值粘贴到这里。
    url: https://proxy302.com/api-keys
  key_secret:
    type: secret-input
    required: true
    label:
      en_US: Key secret
      zh_Hans: Key secret
    placeholder:
      en_US: PROXY302_KEY_SECRET
      zh_Hans: PROXY302_KEY_SECRET
    help:
      en_US: 'Paste the PROXY302_KEY_SECRET value from the same "Copy as env vars". Saving makes one read-only call to check the key.'
      zh_Hans: 粘贴同一次「复制为环境变量」里 PROXY302_KEY_SECRET 的值。保存时只会发起一次只读调用来检查密钥。
    url: https://proxy302.com/api-keys
tools:
  - tools/get_account_usage.yaml
  - tools/list_countries.yaml
  - tools/list_regions.yaml
  - tools/list_products.yaml
  - tools/get_dynamic_proxy.yaml
  - tools/list_my_proxies.yaml
  - tools/fetch_url.yaml
extra:
  python:
    source: provider/proxy302.py
